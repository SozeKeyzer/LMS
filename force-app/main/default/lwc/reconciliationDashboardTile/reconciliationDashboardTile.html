<template>
    <lightning-card title="Reconciliation Status">
        <div class="slds-m-around_medium">
            <template if:true={isDiverged}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small">
                    <p>DIVERGENCE DETECTED — difference exceeds 1 cent threshold</p>
                </div>
            </template>
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-color_weak">Accrued (Engine)</p>
                        <p class="slds-text-heading_medium">{accruedTotal}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-color_weak">Scheduled (Expected)</p>
                        <p class="slds-text-heading_medium">{scheduledTotal}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-color_weak">Cash Received</p>
                        <p class="slds-text-heading_medium">{cashReceived}</p>
                    </div>
                </div>
            </div>
            <p class="slds-text-body_small slds-m-top_small slds-text-align_right">
                Divergence: {divergenceAmount}
            </p>
        </div>
    </lightning-card>
</template>
