<template>
  <lightning-card title="Holder Economics">
    <template if:true={hasError}>
      <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_small" role="alert">
        <strong>Failed to load holders:</strong> {errorMessage}
      </div>
    </template>
    <template if:true={isEmpty}>
      <div class="slds-illustration slds-illustration_small slds-p-around_medium">
        <p class="slds-text-body_regular slds-text-color_weak">No holder data available for this record.</p>
      </div>
    </template>
    <template if:true={hasData}>
      <div class="slds-p-around_medium">
        <lightning-datatable key-field="holderId" data={holderRows} columns={columns}>
        </lightning-datatable>
      </div>
    </template>
  </lightning-card>
</template>
