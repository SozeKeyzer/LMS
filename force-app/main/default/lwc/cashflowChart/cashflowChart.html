<template>
  <lightning-card title="Cashflow Chart">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">

      <template if:true={isLoading}>
        <div class="state-box">
          <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
        </div>
      </template>

      <template if:true={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_small" role="alert">
          {errorMsg}
        </div>
      </template>

      <template if:true={isEmpty}>
        <div class="state-box slds-text-color_weak">
          No payment schedule data. Run the Amortisation Schedule calculation first.
        </div>
      </template>

      <template if:true={hasData}>
        <div class="chart-scroll">
          <svg class="chart-svg"
               viewBox={chartSvg.viewBox}
               xmlns="http://www.w3.org/2000/svg"
               aria-label="Cashflow Chart">

            <!-- Grid lines -->
            <template for:each={chartSvg.yAxis} for:item="yl">
              <line key={yl.lineKey}
                    x1="60" y1={yl.lineY} x2={chartSvg.chartRight} y2={yl.lineY}
                    class="grid-line"/>
            </template>

            <!-- Y-axis labels -->
            <template for:each={chartSvg.yAxis} for:item="yl">
              <text key={yl.textKey}
                    x="58" y={yl.cy}
                    text-anchor="end" dominant-baseline="middle"
                    class="axis-label">{yl.label}</text>
            </template>

            <!-- Bars -->
            <template for:each={chartSvg.bars} for:item="bar">

              <!-- Stacked colour segments (nested for:each) -->
              <template for:each={bar.segs} for:item="seg">
                <rect key={seg.key}
                      x={seg.x} y={seg.y} width={seg.w} height={seg.h}
                      fill={seg.fill}>
                  <title>{seg.label}: {seg.value}</title>
                </rect>
              </template>

              <!-- Total amount label above bar -->
              <text key={bar.totalKey}
                    x={bar.lx} y={bar.totalY}
                    text-anchor="middle" class="bar-label">{bar.total}</text>

              <!-- X-axis date label -->
              <text key={bar.xLabelKey}
                    x={bar.lx} y={bar.ly}
                    text-anchor="middle" class="axis-label">{bar.label}</text>

            </template>

            <!-- X axis baseline -->
            <line x1="60" y1={chartSvg.chartBottom}
                  x2={chartSvg.chartRight} y2={chartSvg.chartBottom}
                  class="axis-line"/>

            <!-- Legend swatches -->
            <template for:each={chartSvg.legendItems} for:item="li">
              <rect key={li.rectKey}
                    x={li.lx} y={chartSvg.legendY} width="12" height="12"
                    fill={li.fill}/>
            </template>

            <!-- Legend labels -->
            <template for:each={chartSvg.legendItems} for:item="li">
              <text key={li.textKey}
                    x={li.lx} y={chartSvg.legendY} dx="16" dy="10"
                    class="legend-label">{li.label}</text>
            </template>

          </svg>
        </div>
      </template>

    </div>
  </lightning-card>
</template>
