<template>
    <lightning-card icon-name="standard:file">
        <span slot="title">Import Secondary Trading Records</span>

        <template lwc:if={hasPermission}>

            <!-- ═══ Step progress indicator ══════════════════════════════════ -->
            <div class="slds-m-horizontal_medium slds-m-top_small slds-m-bottom_medium">
                <div class="step-indicator">
                    <div class={step1Class}>
                        <div class="step-indicator__circle">
                            <template lwc:if={step1Done}>
                                <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                            </template>
                            <template lwc:else>
                                <span>1</span>
                            </template>
                        </div>
                        <span class="step-indicator__label">Upload</span>
                    </div>
                    <div class={connectorClass1}></div>
                    <div class={step2Class}>
                        <div class="step-indicator__circle">
                            <template lwc:if={step2Done}>
                                <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                            </template>
                            <template lwc:else>
                                <span>2</span>
                            </template>
                        </div>
                        <span class="step-indicator__label">Preview</span>
                    </div>
                    <div class={connectorClass2}></div>
                    <div class={step3Class}>
                        <div class="step-indicator__circle">
                            <span>3</span>
                        </div>
                        <span class="step-indicator__label">Result</span>
                    </div>
                </div>
            </div>

            <div class="slds-m-horizontal_medium slds-m-bottom_medium">

                <!-- ═══ STEP 1 — UPLOAD ════════════════════════════════════════ -->
                <template lwc:if={isStepUpload}>

                    <!-- Info panel -->
                    <div class="slds-box slds-box_x-small info-panel slds-m-bottom_medium">
                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                            <div class="slds-col slds-size_1-of-12">
                                <lightning-icon icon-name="utility:info" size="small" variant="inverse"
                                    class="info-panel__icon">
                                </lightning-icon>
                            </div>
                            <div class="slds-col">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">CSV Format</p>
                                <p class="slds-text-body_small">
                                    <strong>Required:</strong> Deal Code, Offer Initiated By, Is Workout/Distressed, Units, Effective Date
                                </p>
                                <p class="slds-text-body_small">
                                    <strong>Optional:</strong> Secondary Trading Name, Buyer, Seller, Syndicate Comms Required, Workout, Unit Price
                                </p>
                                <p class="slds-text-body_small slds-m-top_xx-small">
                                    <strong>Note:</strong> Deal Code must match the exact Deal Code of an existing Deal. Workout must match the exact name of an existing Workout record. Is Workout/Distressed and Syndicate Comms Required accept <em>Yes</em> or <em>No</em> only. Effective Date must be in <strong>DD-MM-YYYY</strong> format (e.g. 25-07-2026).
                                </p>
                            </div>
                            <div class="slds-col slds-no-flex slds-align_absolute-center">
                                <lightning-button
                                    label="Download Template"
                                    icon-name="utility:download"
                                    variant="neutral"
                                    onclick={handleDownloadTemplate}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Drop zone -->
                    <div class={dropZoneClass}
                         ondragover={handleDragOver}
                         ondragleave={handleDragLeave}
                         ondrop={handleDrop}>
                        <div class="drop-zone__inner">
                            <lightning-icon icon-name="doctype:csv" size="large"
                                class="drop-zone__icon slds-m-bottom_small">
                            </lightning-icon>
                            <p class="slds-text-heading_small slds-m-bottom_xx-small">
                                Drag &amp; Drop your CSV here
                            </p>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                or click below to browse
                            </p>
                            <lightning-file-upload
                                label="Choose CSV File"
                                name="csvUpload"
                                accept=".csv"
                                record-id={recordId}
                                multiple="false"
                                onuploadfinished={handleFileUpload}>
                            </lightning-file-upload>
                        </div>
                    </div>

                    <!-- Loading state (parsing) -->
                    <template lwc:if={isLoading}>
                        <div class="slds-m-top_large slds-text-align_center">
                            <lightning-spinner alternative-text="Parsing file…" size="medium"></lightning-spinner>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                                Parsing and validating your file…
                            </p>
                        </div>
                    </template>
                </template>

                <!-- ═══ STEP 2 — PREVIEW ══════════════════════════════════════ -->
                <template lwc:if={isStepPreview}>

                    <!-- Summary bar -->
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center
                                slds-wrap slds-m-bottom_medium summary-bar">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_auto slds-m-bottom_xx-small">
                            <span class="slds-badge badge-success slds-m-right_x-small">
                                <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                &nbsp;{validCount} Valid
                            </span>
                            <template lwc:if={hasErrors}>
                                <span class="slds-badge badge-error">
                                    <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                                    &nbsp;{errorCount} Error{errorPluralS}
                                </span>
                            </template>
                            <span class="slds-m-left_small slds-text-body_small slds-text-color_weak">
                                {totalCount} rows parsed from file
                            </span>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <lightning-button
                                label="Back"
                                icon-name="utility:back"
                                class="slds-m-right_x-small"
                                onclick={handleBack}>
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label={importButtonLabel}
                                icon-name="utility:upload"
                                icon-position="right"
                                disabled={noValidRows}
                                onclick={handleConfirmImport}>
                            </lightning-button>
                        </div>
                    </div>

                    <!-- Warning when some rows have errors -->
                    <template lwc:if={hasErrors}>
                        <div class="slds-scoped-notification slds-media slds-media_center
                                    slds-scoped-notification_light slds-m-bottom_medium" role="status">
                            <div class="slds-media__figure slds-scoped-notification__figure">
                                <lightning-icon icon-name="utility:warning" size="small" variant="warning">
                                </lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p>Rows with errors will be skipped.
                                    Only <strong>{validCount} valid row{validPluralS}</strong> will be imported.
                                    Fix errors in your CSV and re-upload to import all rows.
                                </p>
                            </div>
                        </div>
                    </template>

                    <!-- Datatable preview -->
                    <lightning-datatable
                        key-field="rowNumber"
                        data={previewRows}
                        columns={columns}
                        hide-checkbox-column
                        wrap-text-max-lines="3"
                        class="preview-table">
                    </lightning-datatable>
                </template>

                <!-- ═══ STEP 3 — RESULT ════════════════════════════════════════ -->
                <template lwc:if={isStepResult}>

                    <!-- Loading state (importing) -->
                    <template lwc:if={isLoading}>
                        <div class="slds-text-align_center slds-p-vertical_xx-large">
                            <lightning-spinner alternative-text="Importing records…" size="large">
                            </lightning-spinner>
                            <p class="slds-text-heading_small slds-m-top_x-large slds-m-bottom_x-small">
                                Importing records…
                            </p>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Large batches may take a moment. All existing flows and automations
                                will fire automatically.
                            </p>
                        </div>
                    </template>

                    <!-- Result display -->
                    <template lwc:else>
                        <!-- Success count -->
                        <template lwc:if={importSucceeded}>
                            <div class="result-success-block slds-text-align_center slds-m-bottom_large">
                                <lightning-icon icon-name="action:approval" size="large"
                                    class="result-success-icon slds-m-bottom_small">
                                </lightning-icon>
                                <p class="slds-text-heading_large result-success-text">
                                    {importResult.successCount} Record{successPluralS} Imported
                                </p>
                            </div>
                        </template>

                        <template lwc:if={importAllFailed}>
                            <div class="slds-text-align_center slds-m-bottom_large">
                                <lightning-icon icon-name="utility:error" size="large"
                                    variant="error" class="slds-m-bottom_small">
                                </lightning-icon>
                                <p class="slds-text-heading_medium slds-text-color_error">
                                    No records were imported
                                </p>
                            </div>
                        </template>

                        <!-- Failed rows -->
                        <template lwc:if={hasImportErrors}>
                            <div class="slds-box error-box slds-m-bottom_medium">
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                    <lightning-icon icon-name="utility:error" size="small" variant="error"
                                        class="slds-m-right_x-small">
                                    </lightning-icon>
                                    <h3 class="slds-text-heading_small slds-text-color_error">
                                        {importResult.failureCount} Row{failPluralS} Failed
                                    </h3>
                                </div>
                                <ul class="slds-list_dotted">
                                    <template for:each={importResult.errors} for:item="err">
                                        <li key={err} class="slds-text-body_small error-list-item">{err}</li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <div class="slds-text-align_center slds-m-top_large">
                            <lightning-button
                                label="Import Another File"
                                variant="brand"
                                icon-name="utility:refresh"
                                onclick={handleReset}>
                            </lightning-button>
                        </div>
                    </template>
                </template>

                <!-- ═══ Error banner (inline, dismissible) ════════════════════ -->
                <template lwc:if={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium"
                         role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small"
                            class="slds-m-right_x-small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Error</span>
                        <span>{errorMessage}</span>
                        <div class="slds-notify__close">
                            <button class="slds-button slds-button_icon slds-button_icon-small
                                           slds-button_icon-inverse" title="Close"
                                    onclick={clearError}>
                                <lightning-icon icon-name="utility:close" size="x-small">
                                </lightning-icon>
                            </button>
                        </div>
                    </div>
                </template>

            </div>
        </template>

        <!-- No-permission state -->
        <template lwc:else>
            <div class="slds-illustration slds-illustration_small slds-m-around_large slds-text-align_center">
                <lightning-icon icon-name="utility:lock" size="large" variant="error"
                    class="slds-m-bottom_medium">
                </lightning-icon>
                <h3 class="slds-text-heading_medium">Access Restricted</h3>
                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                    You do not have the <strong>Secondary Trading Import</strong> permission.
                    Contact your administrator.
                </p>
            </div>
        </template>

    </lightning-card>
</template>
