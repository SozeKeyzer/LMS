<template>
  <lightning-card>
    <div slot="title">
      What needs your attention
      <template if:true={hasItems}>
        <lightning-badge label={itemCountLabel} class="slds-m-left_x-small"></lightning-badge>
      </template>
    </div>
    <div>
      <template for:each={displayItems} for:item="item">
        <div key={item.id} class="exception-item">
          <div class={item.iconClass}>
            <span>{item.count}</span>
          </div>
          <div class="exception-body">
            <div class="exception-title">{item.label}</div>
            <div class="exception-meta">{item.detail}</div>
          </div>
          <lightning-button label={item.actionLabel} size="small"
            onclick={handleAction}
            data-id={item.id} data-type={item.objectType}>
          </lightning-button>
        </div>
      </template>
      <template if:false={hasItems}>
        <div class="no-items">
          <lightning-icon icon-name="utility:check" size="medium"
            variant="success"></lightning-icon>
          <p class="slds-m-top_small">No exceptions. All clear.</p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
