<template>
    <lightning-card title="Manual Entry Signal">
        <div class="slds-m-around_medium">
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                    <p class="slds-text-color_weak slds-text-body_small">This Period</p>
                    <p class="slds-text-heading_large">{currentPeriodCount}</p>
                    <template if:true={isHighSignal}>
                        <lightning-badge label="Review Required" class="slds-badge_inverse"></lightning-badge>
                    </template>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                    <p class="slds-text-color_weak slds-text-body_small">YTD</p>
                    <p class="slds-text-heading_large">{ytdCount}</p>
                </div>
            </div>
            <div class="slds-m-top_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">By Object</p>
                <template for:each={byObject} for:item="row">
                    <div key={row.objectName} class="slds-grid slds-m-bottom_x-small">
                        <div class="slds-col slds-size_3-of-4"><p>{row.objectName}</p></div>
                        <div class="slds-col slds-size_1-of-4 slds-text-align_right"><p>{row.count}</p></div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
